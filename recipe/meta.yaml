{% set version = "1.5.4" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-tfruns
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/tfruns_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/tfruns/tfruns_{{ version }}.tar.gz
  sha256: dd22af08aaf1af42e2ba3fba372d91e2f83639a3d73dc464e72c55e26f2a31d2

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-base64enc
    - r-config
    - r-jsonlite >=1.2
    - r-magrittr
    - r-reticulate
    - r-rlang
    - r-rstudioapi >=0.7
    - r-tidyselect
    - r-whisker
    - r-yaml
  run:
    - r-base
    - r-base64enc
    - r-config
    - r-jsonlite >=1.2
    - r-magrittr
    - r-reticulate
    - r-rlang
    - r-rstudioapi >=0.7
    - r-tidyselect
    - r-whisker
    - r-yaml

test:
  commands:
    - $R -e "library('tfruns')"           # [not win]
    - "\"%R%\" -e \"library('tfruns')\""  # [win]

about:
  home: https://github.com/rstudio/tfruns
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: "Create and manage unique directories for each 'TensorFlow'  training run. Provides a unique, time stamped directory for each run along with functions to retrieve the directory of the latest run or  latest several runs. "
  license_family: APACHE

extra:
  recipe-maintainers:
    - conda-forge/r
    - zamorarr
